# 生产 profile：真实 MySQL
# 启动方式： java -jar app.jar --spring.profiles.active=mysql
# 或用环境变量： SPRING_PROFILES_ACTIVE=mysql
#
# 所有敏感配置必须通过环境变量注入，不要写死在文件里。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edu_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
# 口令不设默认值：没配就启动失败，避免误用弱口令上线（docker-compose / 云平台都会注入）
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000

  jpa:
    hibernate:
      # 表结构由 schema-mysql.sql 管理，交给 DBA/SQL 脚本，不用 Hibernate 自动建表
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      # MySQL 不支持 CREATE INDEX IF NOT EXISTS，索引写在建表语句内部
      schema-locations: classpath:schema-mysql.sql

  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    edu.platform: INFO
